<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1410"/>
      <stop offset="100%" stop-color="#120e0a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="quill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#b45309" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#d97706" stop-opacity="0.04"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <g stroke="#ffffff" stroke-opacity="0.02" stroke-width="0.5">
    <line x1="0" y1="0" x2="0" y2="630"/>
    <line x1="100" y1="0" x2="100" y2="630"/>
    <line x1="200" y1="0" x2="200" y2="630"/>
    <line x1="300" y1="0" x2="300" y2="630"/>
    <line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="500" y1="0" x2="500" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="700" y1="0" x2="700" y2="630"/>
    <line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="900" y1="0" x2="900" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
    <line x1="1100" y1="0" x2="1100" y2="630"/>
    <line x1="1200" y1="0" x2="1200" y2="630"/>
  </g>

  <!-- Quill / Map marker decoration -->
  <g transform="translate(830, 230)" opacity="0.1" fill="none" stroke="url(#accent)" stroke-width="1.5">
    <path d="M0,80 Q-20,40 0,0 Q10,-10 30,-30 Q35,-35 25,-20 Q10,0 0,20 Q-10,40 0,80Z"/>
    <path d="M25,-20 Q40,-5 50,10 Q45,5 35,0 Q30,-5 25,-20Z" stroke-width="0.8"/>
    <circle cx="0" cy="80" r="6"/>
  </g>

  <g transform="translate(100, 180)">
    <rect x="0" y="0" width="64" height="4" rx="2" fill="url(#accent)"/>

    <text x="0" y="80" font-family="'Segoe UI', system-ui, sans-serif" font-size="82" font-weight="300" fill="#f7f7f7" letter-spacing="0.02em">Story Maker</text>

    <text x="0" y="130" font-family="'Segoe UI', system-ui, sans-serif" font-size="22" font-weight="400" fill="#929aab" letter-spacing="0.08em" text-transform="uppercase">AI-Powered Story Writing Platform</text>

    <rect x="0" y="165" width="48" height="2" rx="1" fill="url(#accent)" fill-opacity="0.6"/>

    <g transform="translate(0, 210)">
      <rect x="0" y="0" width="8" height="8" rx="2" fill="url(#accent)" fill-opacity="0.4"/>
      <text x="22" y="9" font-family="'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="400" fill="#929aab">7 LLM Providers with Auto-Fallback</text>
    </g>
    <g transform="translate(0, 240)">
      <rect x="0" y="0" width="8" height="8" rx="2" fill="url(#accent)" fill-opacity="0.4"/>
      <text x="22" y="9" font-family="'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="400" fill="#929aab">Interactive Map + Location Storytelling</text>
    </g>
    <g transform="translate(0, 270)">
      <rect x="0" y="0" width="8" height="8" rx="2" fill="url(#accent)" fill-opacity="0.4"/>
      <text x="22" y="9" font-family="'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="400" fill="#929aab">75+ Languages · 10 Genres · TXT/PDF Export</text>
    </g>
  </g>
</svg>
