<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#141428"/>
      <stop offset="100%" stop-color="#0d0d1a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <g stroke="#ffffff" stroke-opacity="0.02" stroke-width="0.5">
    <line x1="0" y1="0" x2="0" y2="630"/>
    <line x1="100" y1="0" x2="100" y2="630"/>
    <line x1="200" y1="0" x2="200" y2="630"/>
    <line x1="300" y1="0" x2="300" y2="630"/>
    <line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="500" y1="0" x2="500" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="700" y1="0" x2="700" y2="630"/>
    <line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="900" y1="0" x2="900" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
    <line x1="1100" y1="0" x2="1100" y2="630"/>
    <line x1="1200" y1="0" x2="1200" y2="630"/>
  </g>

  <!-- Brain / network nodes decoration -->
  <g transform="translate(830, 200)" opacity="0.1" fill="none" stroke="url(#accent)" stroke-width="1.2">
    <circle cx="0" cy="60" r="8"/>
    <circle cx="-40" cy="0" r="6"/>
    <circle cx="40" cy="0" r="6"/>
    <circle cx="-60" cy="80" r="5"/>
    <circle cx="60" cy="80" r="5"/>
    <circle cx="0" cy="120" r="7"/>
    <line x1="0" y1="60" x2="-40" y2="0"/>
    <line x1="0" y1="60" x2="40" y2="0"/>
    <line x1="0" y1="60" x2="-60" y2="80"/>
    <line x1="0" y1="60" x2="60" y2="80"/>
    <line x1="0" y1="60" x2="0" y2="120"/>
    <line x1="-40" y1="0" x2="40" y2="0"/>
    <line x1="-60" y1="80" x2="60" y2="80"/>
  </g>

  <g transform="translate(100, 180)">
    <rect x="0" y="0" width="64" height="4" rx="2" fill="url(#accent)"/>

    <text x="0" y="80" font-family="'Segoe UI', system-ui, sans-serif" font-size="82" font-weight="300" fill="#f7f7f7" letter-spacing="0.02em">AI Analyst Suite</text>

    <text x="0" y="130" font-family="'Segoe UI', system-ui, sans-serif" font-size="22" font-weight="400" fill="#929aab" letter-spacing="0.08em" text-transform="uppercase">Business Analysis Platform</text>

    <rect x="0" y="165" width="48" height="2" rx="1" fill="url(#accent)" fill-opacity="0.6"/>

    <g transform="translate(0, 210)">
      <rect x="0" y="0" width="8" height="8" rx="2" fill="url(#accent)" fill-opacity="0.4"/>
      <text x="22" y="9" font-family="'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="400" fill="#929aab">7 LLM Providers with Auto-Fallback</text>
    </g>
    <g transform="translate(0, 240)">
      <rect x="0" y="0" width="8" height="8" rx="2" fill="url(#accent)" fill-opacity="0.4"/>
      <text x="22" y="9" font-family="'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="400" fill="#929aab">6 Analyst Personas · Parallel Execution</text>
    </g>
    <g transform="translate(0, 270)">
      <rect x="0" y="0" width="8" height="8" rx="2" fill="url(#accent)" fill-opacity="0.4"/>
      <text x="22" y="9" font-family="'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="400" fill="#929aab">KPIs · Charts · Tables · HTML/PDF Export</text>
    </g>
  </g>
</svg>
