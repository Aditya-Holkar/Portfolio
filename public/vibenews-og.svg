<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2d3238"/>
      <stop offset="100%" stop-color="#1a1d22"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#e65100"/>
      <stop offset="100%" stop-color="#ff8f00"/>
    </linearGradient>
    <linearGradient id="pulse" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e65100" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#ff8f00" stop-opacity="0.04"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Subtle grid pattern -->
  <g stroke="#ffffff" stroke-opacity="0.02" stroke-width="0.5">
    <line x1="0" y1="0" x2="0" y2="630"/>
    <line x1="100" y1="0" x2="100" y2="630"/>
    <line x1="200" y1="0" x2="200" y2="630"/>
    <line x1="300" y1="0" x2="300" y2="630"/>
    <line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="500" y1="0" x2="500" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="700" y1="0" x2="700" y2="630"/>
    <line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="900" y1="0" x2="900" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
    <line x1="1100" y1="0" x2="1100" y2="630"/>
    <line x1="1200" y1="0" x2="1200" y2="630"/>
  </g>

  <!-- News pulse / broadcast wave decoration -->
  <g transform="translate(820, 315)" opacity="0.12">
    <circle cx="0" cy="0" r="30" fill="none" stroke="url(#accent)" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="80" fill="none" stroke="url(#accent)" stroke-width="1"/>
    <circle cx="0" cy="0" r="140" fill="none" stroke="url(#accent)" stroke-width="0.6"/>
    <circle cx="0" cy="0" r="210" fill="none" stroke="url(#accent)" stroke-width="0.4"/>
    <line x1="-140" y1="-140" x2="140" y2="140" stroke="url(#accent)" stroke-width="0.5"/>
    <line x1="-140" y1="140" x2="140" y2="-140" stroke="url(#accent)" stroke-width="0.5"/>
  </g>

  <!-- Content -->
  <g transform="translate(100, 180)">
    <!-- Decorative accent bar -->
    <rect x="0" y="0" width="64" height="4" rx="2" fill="url(#accent)"/>

    <!-- Product Name -->
    <text x="0" y="80" font-family="'Segoe UI', system-ui, sans-serif" font-size="82" font-weight="300" fill="#f7f7f7" letter-spacing="0.02em">VibeNews</text>

    <!-- Tagline -->
    <text x="0" y="130" font-family="'Segoe UI', system-ui, sans-serif" font-size="22" font-weight="400" fill="#929aab" letter-spacing="0.08em" text-transform="uppercase">Curated News Aggregation Platform</text>

    <!-- Bottom accent line -->
    <rect x="0" y="165" width="48" height="2" rx="1" fill="url(#accent)" fill-opacity="0.6"/>

    <!-- Features -->
    <g transform="translate(0, 210)">
      <rect x="0" y="0" width="8" height="8" rx="2" fill="url(#accent)" fill-opacity="0.4"/>
      <text x="22" y="9" font-family="'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="400" fill="#929aab">Real-time News Aggregation</text>
    </g>
    <g transform="translate(0, 240)">
      <rect x="0" y="0" width="8" height="8" rx="2" fill="url(#accent)" fill-opacity="0.4"/>
      <text x="22" y="9" font-family="'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="400" fill="#929aab">Search &amp; Category Filtering</text>
    </g>
    <g transform="translate(0, 270)">
      <rect x="0" y="0" width="8" height="8" rx="2" fill="url(#accent)" fill-opacity="0.4"/>
      <text x="22" y="9" font-family="'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="400" fill="#929aab">Dark / Light Theme</text>
    </g>
  </g>
</svg>
