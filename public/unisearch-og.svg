<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f0d2e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="globe" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#d97706" stop-opacity="0.04"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Subtle grid pattern -->
  <g stroke="#ffffff" stroke-opacity="0.02" stroke-width="0.5">
    <line x1="0" y1="0" x2="0" y2="630"/>
    <line x1="100" y1="0" x2="100" y2="630"/>
    <line x1="200" y1="0" x2="200" y2="630"/>
    <line x1="300" y1="0" x2="300" y2="630"/>
    <line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="500" y1="0" x2="500" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="700" y1="0" x2="700" y2="630"/>
    <line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="900" y1="0" x2="900" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
    <line x1="1100" y1="0" x2="1100" y2="630"/>
    <line x1="1200" y1="0" x2="1200" y2="630"/>
  </g>

  <!-- Globe wireframe decoration (subtle, right side) -->
  <circle cx="850" cy="315" r="220" fill="none" stroke="url(#accent)" stroke-width="0.8" stroke-opacity="0.15"/>
  <circle cx="850" cy="315" r="170" fill="none" stroke="url(#accent)" stroke-width="0.5" stroke-opacity="0.1"/>
  <ellipse cx="850" cy="315" rx="90" ry="220" fill="none" stroke="url(#accent)" stroke-width="0.5" stroke-opacity="0.1"/>
  <ellipse cx="850" cy="315" rx="220" ry="90" fill="none" stroke="url(#accent)" stroke-width="0.5" stroke-opacity="0.08"/>
  <line x1="630" y1="315" x2="1070" y2="315" stroke="url(#accent)" stroke-width="0.5" stroke-opacity="0.08"/>
  <line x1="850" y1="95" x2="850" y2="535" stroke="url(#accent)" stroke-width="0.5" stroke-opacity="0.08"/>

  <!-- Graduation cap icon (left, subtle) -->
  <g transform="translate(90, 160)" fill="none" stroke="url(#accent)" stroke-width="1.5" stroke-opacity="0.12">
    <rect x="0" y="0" width="40" height="24" rx="4"/>
    <rect x="8" y="4" width="24" height="16" rx="2"/>
    <line x1="20" y1="0" x2="20" y2="-10"/>
    <circle cx="20" cy="-12" r="3"/>
  </g>

  <!-- Content -->
  <g transform="translate(100, 180)">
    <!-- Decorative accent bar -->
    <rect x="0" y="0" width="64" height="4" rx="2" fill="url(#accent)"/>

    <!-- Product Name -->
    <text x="0" y="80" font-family="'Segoe UI', system-ui, sans-serif" font-size="82" font-weight="300" fill="#f7f7f7" letter-spacing="0.02em">UniSearch</text>

    <!-- Tagline -->
    <text x="0" y="130" font-family="'Segoe UI', system-ui, sans-serif" font-size="22" font-weight="400" fill="#929aab" letter-spacing="0.08em" text-transform="uppercase">University Discovery Platform</text>

    <!-- Bottom accent line -->
    <rect x="0" y="165" width="48" height="2" rx="1" fill="url(#accent)" fill-opacity="0.6"/>

    <!-- Features -->
    <g transform="translate(0, 210)">
      <rect x="0" y="0" width="8" height="8" rx="2" fill="url(#accent)" fill-opacity="0.4"/>
      <text x="22" y="9" font-family="'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="400" fill="#929aab">React + Vite SPA</text>
    </g>
    <g transform="translate(0, 240)">
      <rect x="0" y="0" width="8" height="8" rx="2" fill="url(#accent)" fill-opacity="0.4"/>
      <text x="22" y="9" font-family="'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="400" fill="#929aab">15,000+ University Database</text>
    </g>
    <g transform="translate(0, 270)">
      <rect x="0" y="0" width="8" height="8" rx="2" fill="url(#accent)" fill-opacity="0.4"/>
      <text x="22" y="9" font-family="'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="400" fill="#929aab">Dark / Light Theme + Favorites</text>
    </g>
  </g>
</svg>
