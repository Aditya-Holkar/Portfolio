<svg width="1200" height="900" viewBox="0 0 1200 900" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="splash-dots" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#1a1a1a" opacity="0.5"/>
    </pattern>
    <filter id="splash-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="12" flood-color="#7c4dff" flood-opacity="0.25"/>
    </filter>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d0d0d"/>
      <stop offset="100%" stop-color="#0a0a0a"/>
    </linearGradient>
    <linearGradient id="boxGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="rgba(124,77,255,0.15)"/>
      <stop offset="100%" stop-color="rgba(124,77,255,0.05)"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="900" fill="url(#bgGrad)"/>
  <rect width="1200" height="900" fill="url(#splash-dots)"/>

  <!-- Subtle radial glow behind center -->
  <radialGradient id="centerGlow" cx="0.5" cy="0.4" r="0.35">
    <stop offset="0%" stop-color="#7c4dff" stop-opacity="0.06"/>
    <stop offset="100%" stop-color="#7c4dff" stop-opacity="0"/>
  </radialGradient>
  <rect width="1200" height="900" fill="url(#centerGlow)"/>

  <!-- Horizontal accent line top -->
  <rect x="480" y="80" width="240" height="1" fill="rgba(124,77,255,0.15)"/>

  <!-- "AH" monogram box -->
  <rect x="532" y="290" width="136" height="136" rx="24" fill="url(#boxGrad)" stroke="rgba(124,77,255,0.25)" stroke-width="1.5" filter="url(#splash-glow)"/>
  <rect x="532" y="290" width="136" height="136" rx="24" fill="none" stroke="rgba(124,77,255,0.08)" stroke-width="1" transform="translate(3, 3)"/>

  <!-- Decorative corners -->
  <line x1="544" y1="302" x2="560" y2="302" stroke="rgba(124,77,255,0.3)" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="656" y1="302" x2="640" y2="302" stroke="rgba(124,77,255,0.3)" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="544" y1="414" x2="560" y2="414" stroke="rgba(124,77,255,0.3)" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="656" y1="414" x2="640" y2="414" stroke="rgba(124,77,255,0.3)" stroke-width="1.5" stroke-linecap="round"/>

  <text x="600" y="386" text-anchor="middle" font-family="'Times New Roman',Georgia,serif" font-size="58" font-weight="700" fill="#7c4dff">AH</text>

  <!-- "Aditya Holkar" title -->
  <text x="600" y="490" text-anchor="middle" font-family="'Times New Roman',Georgia,serif" font-size="26" font-weight="600" fill="#fcfcfc" letter-spacing="1">Aditya Holkar</text>

  <!-- Subtitle -->
  <text x="600" y="520" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#5a5a5a" letter-spacing="3">FRONTEND DEVELOPER</text>

  <!-- Decorative line below subtitle -->
  <rect x="548" y="540" width="104" height="1" fill="rgba(124,77,255,0.15)"/>

  <!-- Loading dots -->
  <g transform="translate(0, 0)">
    <circle cx="576" cy="560" r="2" fill="#7c4dff" opacity="0.4">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="1.4s" repeatCount="indefinite" begin="0s"/>
    </circle>
    <circle cx="590" cy="560" r="2" fill="#7c4dff" opacity="0.4">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="1.4s" repeatCount="indefinite" begin="0.2s"/>
    </circle>
    <circle cx="604" cy="560" r="2" fill="#7c4dff" opacity="0.4">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="1.4s" repeatCount="indefinite" begin="0.4s"/>
    </circle>
    <circle cx="618" cy="560" r="2" fill="#7c4dff" opacity="0.4">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="1.4s" repeatCount="indefinite" begin="0.6s"/>
    </circle>
    <circle cx="632" cy="560" r="2" fill="#7c4dff" opacity="0.4">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="1.4s" repeatCount="indefinite" begin="0.8s"/>
    </circle>
  </g>

  <!-- Loading counter at bottom -->
  <rect x="540" y="740" width="120" height="1" fill="rgba(124,77,255,0.1)"/>

  <text x="600" y="790" text-anchor="middle" font-family="'Courier New',monospace" font-size="64" font-weight="700" fill="#fcfcfc" opacity="0.9">00</text>
  <text x="600" y="822" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#5a5a5a" letter-spacing="3">LOADING</text>

  <!-- Loading bar -->
  <rect x="440" y="845" width="320" height="3" rx="1.5" fill="rgba(252,252,252,0.04)"/>
  <rect x="440" y="845" width="0" height="3" rx="1.5" fill="#7c4dff">
    <animate attributeName="width" values="0;320" dur="2.2s" repeatCount="indefinite"/>
  </rect>

  <!-- Horizontal accent line bottom -->
  <rect x="480" y="820" width="240" height="1" fill="rgba(124,77,255,0.08)"/>

</svg>
