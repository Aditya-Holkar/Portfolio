<svg width="1200" height="900" viewBox="0 0 1200 900" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="900" fill="#0d0d0d"/>

  <!-- Top accent line -->
  <rect x="480" y="80" width="240" height="1" fill="#7c4dff" opacity="0.15"/>

  <!-- "AH" monogram box -->
  <rect x="532" y="290" width="136" height="136" rx="24" fill="#7c4dff" opacity="0.08" stroke="#7c4dff" stroke-width="1.5" stroke-opacity="0.25"/>
  <rect x="535" y="293" width="130" height="130" rx="22" fill="none" stroke="#7c4dff" stroke-width="1" stroke-opacity="0.08"/>

  <!-- Decorative corners -->
  <line x1="544" y1="302" x2="560" y2="302" stroke="#7c4dff" stroke-width="1.5" opacity="0.3"/>
  <line x1="656" y1="302" x2="640" y2="302" stroke="#7c4dff" stroke-width="1.5" opacity="0.3"/>
  <line x1="544" y1="414" x2="560" y2="414" stroke="#7c4dff" stroke-width="1.5" opacity="0.3"/>
  <line x1="656" y1="414" x2="640" y2="414" stroke="#7c4dff" stroke-width="1.5" opacity="0.3"/>

  <text x="600" y="386" text-anchor="middle" font-family="Georgia,serif" font-size="58" font-weight="700" fill="#7c4dff">AH</text>

  <!-- "Aditya Holkar" title -->
  <text x="600" y="490" text-anchor="middle" font-family="Georgia,serif" font-size="26" font-weight="600" fill="#fcfcfc" letter-spacing="1">Aditya Holkar</text>

  <!-- Subtitle -->
  <text x="600" y="520" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" fill="#5a5a5a" letter-spacing="3">FRONTEND DEVELOPER</text>

  <!-- Decorative line below subtitle -->
  <rect x="548" y="540" width="104" height="1" fill="#7c4dff" opacity="0.15"/>

  <!-- Loading dots (static, no animation) -->
  <circle cx="576" cy="560" r="2" fill="#7c4dff" opacity="0.4"/>
  <circle cx="590" cy="560" r="2" fill="#7c4dff" opacity="0.6"/>
  <circle cx="604" cy="560" r="2" fill="#7c4dff" opacity="0.8"/>
  <circle cx="618" cy="560" r="2" fill="#7c4dff" opacity="0.6"/>
  <circle cx="632" cy="560" r="2" fill="#7c4dff" opacity="0.4"/>

  <!-- Loading counter at bottom -->
  <rect x="540" y="740" width="120" height="1" fill="#7c4dff" opacity="0.1"/>

  <text x="600" y="790" text-anchor="middle" font-family="'Courier New',monospace" font-size="64" font-weight="700" fill="#fcfcfc" opacity="0.9">00</text>
  <text x="600" y="822" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" fill="#5a5a5a" letter-spacing="3">LOADING</text>

  <!-- Loading bar (static, no animation) -->
  <rect x="440" y="845" width="320" height="3" rx="1.5" fill="#1a1a1a"/>
  <rect x="440" y="845" width="160" height="3" rx="1.5" fill="#7c4dff" opacity="0.6"/>

  <!-- Bottom accent line -->
  <rect x="480" y="820" width="240" height="1" fill="#7c4dff" opacity="0.08"/>

</svg>
