    </filter>
    <linearGradient id="sidebarGradLight" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f5f5f5"/>
      <stop offset="100%" stop-color="#f5f5f5" stop-opacity="0.88"/>
