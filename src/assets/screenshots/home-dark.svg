      <circle cx="2" cy="2" r="1" fill="#1a1a1a" opacity="0.6"/>
    </pattern>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#000" flood-opacity="0.4"/>
    </filter>
    <filter id="glow">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#7c4dff" flood-opacity="0.3"/>
    </filter>
    <linearGradient id="sidebarGrad" x1="0" y1="0" x2="1" y2="0">
